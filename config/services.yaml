# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:
    locale: en_US

services:
    App\EventListener\AdminListener:
        arguments: [ '@request_stack' ]
        tags:
            - { name: kernel.event_listener, event: sylius.admin_user.pre_delete, method: preDelete }
            - { name: kernel.event_listener, event: sylius.admin_user.pre_update, method: preUpdate }

    App\EventListener\PaymentMethodListener:
        arguments: [ '@request_stack', '@router' ]
        tags:
            - { name: kernel.event_listener, event: kernel.request , method: preCreate }

    App\EventListener\AdyenListener:
        arguments: [ '@request_stack', '@router' ]
        tags:
            - { name: kernel.event_listener, event: kernel.request , method: preAccess }

    App\EventListener\ChannelListener:
        arguments: [ '@request_stack', '@router' ]
        tags:
            - { name: kernel.event_listener, event: kernel.request , method: preCreate }

    App\EventListener\UserRegistrationListener:
        class: App\EventListener\UserRegistrationListener
        arguments: [ '@request_stack', '@App\Generator\FlashMessageGeneratorInterface' ]
        tags:
            - { name: kernel.event_listener, event: sylius.user.email_verification.token , method: addVerificationLink }

    App\Generator\FlashMessageGeneratorInterface:
        class: App\Generator\VerificationFlashMessageGenerator
        arguments: ['@router', '@translator.default']

    App\Form\Extension\MollieGatewayConfigurationTypeExtension:
        class: App\Form\Extension\MollieGatewayConfigurationTypeExtension
        tags:
            - { name: form.type_extension }

    App\Form\Extension\PayPalConfigurationTypeExtension:
        class: App\Form\Extension\PayPalConfigurationTypeExtension
        tags:
            - { name: form.type_extension }

    App\Form\Extension\StripeGatewayConfigurationTypeExtension:
        class: App\Form\Extension\StripeGatewayConfigurationTypeExtension
        tags:
            - { name: form.type_extension }

    App\Form\Extension\AdyenConfigurationTypeExtension:
        class: App\Form\Extension\AdyenConfigurationTypeExtension
        tags:
            - { name: form.type_extension }

    App\Api\Serializer\GatewayConfigNormalizer:
        tags:
            - { name: serializer.normalizer, priority: 100 }

    sylius.http_client:
        class: GuzzleHttp\Client
